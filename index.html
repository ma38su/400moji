<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>四百字 — 縦書き原稿用紙</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="四百字 ホーム">
      <span class="brand-mark">四〇〇</span>
      <span>四百字</span>
    </a>
    <div class="document-meta">
      <input id="title" class="title-input" value="無題の原稿" aria-label="原稿タイトル">
      <span id="saveStatus" class="save-status">保存済み</span>
    </div>
    <div class="actions">
      <details class="menu">
        <summary class="button">ファイル</summary>
        <div class="menu-panel">
          <button id="exportText">TXTを書き出す</button>
          <button id="exportJson">JSONを書き出す</button>
          <label class="file-label">JSONを読み込む<input id="importJson" type="file" accept="application/json,.json"></label>
        </div>
      </details>
      <button id="printButton" class="button primary">印刷</button>
    </div>
  </header>

  <main>
    <section class="workspace" aria-label="原稿エディタ">
      <div class="paper-wrap">
        <div class="paper-heading">
          <span id="pageLabel">1枚目</span>
          <span class="keyboard-hint">用紙をクリックして入力</span>
        </div>
        <div id="paper" class="paper" role="textbox" aria-label="縦書き原稿用紙" aria-multiline="true" tabindex="0"></div>
        <textarea id="input" class="input-proxy" aria-label="原稿本文" spellcheck="false"></textarea>
      </div>

      <aside class="sidebar">
        <div class="stat-card">
          <span class="eyebrow">原稿の状態</span>
          <strong id="charCount" class="big-number">0</strong>
          <span>マス使用</span>
          <div class="meter"><span id="meterFill"></span></div>
          <p id="sheetCount">1枚目・未入力</p>
          <p id="inputCharCount">入力文字数: 0文字</p>
        </div>
        <div class="page-nav">
          <button id="prevPage" aria-label="前のページ">←</button>
          <span id="pageCount">1 / 1</span>
          <button id="nextPage" aria-label="次のページ">→</button>
        </div>
        <div class="note">
          <span class="eyebrow">保存について</span>
          <p>本文・タイトル・入力位置はこのブラウザのlocalStorageへ自動保存されます。Cookieにも短い復旧用コピーを残します。</p>
        </div>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
