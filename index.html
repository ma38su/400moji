<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="description" content="縦書き原稿用紙で文章を書ける、オフライン対応の執筆アプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="原稿用紙アプリ - 400moji">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>原稿用紙アプリ - 400moji</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="原稿用紙アプリ - 400moji ホーム">
      <span class="brand-mark">四〇〇</span>
      <span>原稿用紙アプリ - 400moji</span>
    </a>
    <div class="document-meta">
      <input id="title" class="title-input" value="無題の原稿" aria-label="ファイル名">
      <span id="saveStatus" class="save-status">保存済み</span>
    </div>
    <div class="actions">
      <div class="history-actions" aria-label="編集履歴">
        <button id="undoButton" class="button icon-button" type="button" aria-label="元に戻す" title="元に戻す（Ctrl/Cmd+Z）" disabled>↶</button>
        <button id="redoButton" class="button icon-button" type="button" aria-label="やり直す" title="やり直す（Ctrl/Cmd+Shift+Z）" disabled>↷</button>
      </div>
      <button id="installApp" class="button install-button compact-action" type="button" hidden>
        <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        <span class="button-label">アプリをインストール</span>
      </button>
      <button id="fullscreenButton" class="button compact-action" type="button" aria-pressed="false" aria-label="全画面" title="全画面">
        <svg class="button-icon icon-expand" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="button-icon icon-minimize" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        <span class="button-label">全画面</span>
      </button>
      <details class="menu">
        <summary class="button compact-action" aria-label="ファイルメニュー" title="ファイルメニュー">
          <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6"/></svg>
          <span class="button-label">ファイル</span>
        </summary>
        <div class="menu-panel">
          <button id="newDocument">新しいファイル</button>
          <button id="duplicateDocument">複製</button>
          <hr>
          <button id="importClipboard">クリップボードから読み込む</button>
          <button id="exportText">TXTを書き出す</button>
          <button id="exportJson">JSONを書き出す</button>
          <label class="file-label">TXTを読み込む<input id="importText" type="file" accept="text/plain,.txt"></label>
          <label class="file-label">JSONを読み込む<input id="importJson" type="file" accept="application/json,.json"></label>
          <hr>
          <label class="print-preset-label" for="printPreset">
            <span>印刷書式</span>
            <select id="printPreset">
              <option value="jis-a4">A4・JIS寸法（8.5mm）</option>
              <option value="school-a4">A4・学校向け（9mm）</option>
            </select>
          </label>
        </div>
      </details>
      <button id="printButton" class="button primary">印刷</button>
    </div>
  </header>

  <main>
    <section class="workspace" aria-label="原稿エディタ">
      <aside class="sidebar">
        <div class="file-card">
          <label class="eyebrow" for="documentSelect">原稿ファイル</label>
          <select id="documentSelect" class="document-select" aria-label="ファイルを選択"></select>
        </div>
        <div class="stat-card">
          <span class="eyebrow">原稿の状態</span>
          <span class="mobile-stat-line"><strong id="charCount" class="big-number">0</strong><span class="stat-unit">マス使用</span></span>
          <div class="meter"><span id="meterFill"></span></div>
          <p id="sheetCount">1枚目・未入力</p>
          <p id="inputCharCount">入力文字数: 0文字</p>
        </div>
      </aside>

      <div class="paper-wrap">
        <div class="paper-heading">
          <div class="view-switch" aria-label="表示モード">
            <button id="paperViewButton" type="button" aria-pressed="true">原稿用紙</button>
            <button id="editViewButton" type="button" aria-pressed="false">編集</button>
          </div>
          <div class="page-nav paper-pagination" aria-label="ページ送り">
            <button id="nextPage" aria-label="次のページ">←</button>
            <span id="pageCount">1 / 1</span>
            <button id="prevPage" aria-label="前のページ">→</button>
          </div>
          <span id="viewHint" class="keyboard-hint">ドラッグで選択・クリックして入力</span>
        </div>
        <div id="paper" class="paper" role="textbox" aria-label="縦書き原稿用紙" aria-multiline="true" tabindex="0"></div>
        <textarea id="input" class="input-proxy" aria-label="原稿本文" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <section id="printPages" class="print-pages" aria-hidden="true"></section>

  <div id="paperContextMenu" class="context-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-edit-action="copy">コピー</button>
    <button type="button" role="menuitem" data-edit-action="cut">カット</button>
    <button type="button" role="menuitem" data-edit-action="paste">ペースト</button>
    <hr>
    <button type="button" role="menuitem" data-edit-action="delete">削除</button>
    <button type="button" role="menuitem" data-edit-action="select-all">すべて選択</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="nameDialog" class="name-dialog">
    <form id="nameForm" method="dialog">
      <h2 id="nameDialogTitle">新しいファイル</h2>
      <label for="documentName">ファイル名</label>
      <input id="documentName" autocomplete="off" required>
      <p id="nameError" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="cancelName">キャンセル</button>
        <button type="submit" class="button primary">作成</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
